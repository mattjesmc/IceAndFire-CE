plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    // MMCP dev bridge (../mcmodding): in-game MCP tools for the dev client. Must come after Loom.
    id 'com.mattmc.mcmod' version '0.7.0'
    id 'maven-publish'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Locally built library jars that have no public Fabric 26.2 release yet
    flatDir { dirs 'libs' }
}

loom {
    accessWidenerPath = file('src/main/resources/iceandfire.accesswidener')

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            ideConfigGenerated true
            runDir 'run'
        }
        server {
            server()
            ideConfigGenerated true
            runDir 'run-server'
        }
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

sourceSets.main.java {
    // Integrations without a Fabric 26.2 release (mirrors upstream's exclusions, plus Curios which is NeoForge-only)
    exclude 'com/iafenvoy/iceandfire/compat/ponder/**'
    exclude 'com/iafenvoy/iceandfire/compat/emi/**'
    exclude 'com/iafenvoy/iceandfire/compat/curios/**'
    exclude 'com/iafenvoy/iceandfire/compat/ProjectEDragonForgeMapper.java'
    exclude 'com/iafenvoy/iceandfire/compat/IceAndFireArsNouveauCompat.java'
}

// Dependencies that are only wanted on the dev runtime classpath and must not leak into the published POM.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Uranus (animation/model library) - Fabric fork lives in this repo and is bundled (jar-in-jar)
    implementation project(':uranus')
    include project(':uranus')

    // Jupiter (config library) - universal jar built from IAFEnvoy/Jupiter for 26.2, see libs/README.md
    implementation "com.iafenvoy:jupiter:${project.jupiter_version}"
    include "com.iafenvoy:jupiter:${project.jupiter_version}"

    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

    compileOnly "maven.modrinth:jade:${project.jade_version}"
    localRuntime "maven.modrinth:jade:${project.jade_version}"

    // Farmer's Delight Refabricated (Fabric port of Farmer's Delight; keeps mod id "farmersdelight") for the food compat
    localRuntime "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
    it.options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache with IDEA sync yet
org.gradle.configuration-cache=false

# Fabric Properties (https://fabricmc.net/develop)
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.20
fabric_api_version=0.160.0+26.2
# same value under the key the com.mattmc.mcmod plugin reads
fabric_version=0.160.0+26.2

## Mod Properties
mod_id=iceandfire
mod_name=Ice And Fire Community Edition
mod_license=LGPL-3.0
mod_version=2.2-beta.1+fabric
mod_group_id=com.iafenvoy.iceandfire

# Bundled library forks (see /uranus and /libs)
uranus_version=3.0-alpha.1+fabric
jupiter_version=2.4.3-26.2-universal

# Optional integrations
jei_version=30.32.0.215
jade_version=ue8CO97w
modmenu_version=20.0.2
farmers_delight_version=jUfTpAIM

# MMCP dev bridge (../mcmodding). THE PORT IS THE PROJECT CONSTANT: the dev game binds its MCP bridge here and every
# MCP registration in this repository must name it. 25651 is unused by the other checkouts on this machine.
mcmod.port=25651
mcptoolkit_version=0.148.0

# checkAssets flags loot-table names and c: convention tags as dangling; keep it informational (`gradlew checkAssets`)
mcmod.assets.check=false
